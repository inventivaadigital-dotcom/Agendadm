name: Importar projeto

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair projeto
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Nenhum ZIP encontrado."
            exit 0
          fi
          unzip -o "$ZIP" -d .
          rm "$ZIP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adicionar arquivos do aplicativo"
          git push
